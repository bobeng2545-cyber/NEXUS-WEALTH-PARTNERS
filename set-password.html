
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#102b46">
    <title>Set Your Password | Nexus Wealth Partners</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
        }

        .password-card {
            width: 100%;
            max-width: 440px;
            padding: 38px 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(16, 43, 70, 0.10);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #102b46;
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #102b46;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #12a879;
            box-shadow: 0 0 0 3px rgba(18, 168, 121, 0.10);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #12a879;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #07865e;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        #message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        #message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        #message.info {
            display: block;
            color: #1e40af;
            background: #dbeafe;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .password-note {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="password-card">

        <div class="logo">N</div>

        <h1>Create Your Password</h1>

        <p class="subtitle">
            Welcome to Nexus Wealth Partners.
            Create a secure password to activate your staff account.
        </p>

        <div id="message"></div>

        <form id="passwordForm">

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter your new password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

                <p class="password-note">
                    Use at least 8 characters.
                </p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="submitButton">
                Set My Password
            </button>

        </form>

        <div class="footer">
            © 2026 Nexus Wealth Partners. All rights reserved.
        </div>

    </div>

    <script>
        /* =====================================
           SUPABASE CONNECTION
        ===================================== */

        const SUPABASE_URL =
            "https://lzvtgxittsdhgjnfzdpk.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_191rkqJFaFYGbZxZMAzFPQ_DyMa5wi0";

        const nexusSupabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================
           PAGE ELEMENTS
        ===================================== */

        const passwordForm =
            document.getElementById("passwordForm");

        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const submitButton =
            document.getElementById("submitButton");

        const messageBox =
            document.getElementById("message");


        /* =====================================
           DISPLAY MESSAGE
        ===================================== */

        function showMessage(message, type) {

            messageBox.textContent = message;

            messageBox.className = type;

        }


        /* =====================================
           CHECK INVITATION SESSION
        ===================================== */

        let invitationSessionReady = false;

        async function checkInvitationSession() {

            try {

                const {
                    data,
                    error
                } = await nexusSupabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {

                    showMessage(
                        "Your invitation link is invalid, expired, or has already been used. Please contact the administrator for a new invitation.",
                        "error"
                    );

                    passwordForm.style.display = "none";

                    return;
                }

                invitationSessionReady = true;

                showMessage(
                    "Your invitation has been verified. You can now create your password.",
                    "info"
                );

            } catch (error) {

                console.error(
                    "Invitation verification error:",
                    error
                );

                showMessage(
                    "We could not verify your invitation. Please try opening the invitation email again.",
                    "error"
                );

                passwordForm.style.display = "none";
            }
        }


        /* =====================================
           SET PASSWORD
        ===================================== */

        passwordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                if (!invitationSessionReady) {

                    showMessage(
                        "Your invitation has not been verified yet.",
                        "error"
                    );

                    return;
                }

                const password =
                    newPassword.value;

                const confirmation =
                    confirmPassword.value;

                if (password.length < 8) {

                    showMessage(
                        "Your password must contain at least 8 characters.",
                        "error"
                    );

                    return;
                }

                if (password !== confirmation) {

                    showMessage(
                        "The passwords do not match.",
                        "error"
                    );

                    return;
                }

                submitButton.disabled = true;

                submitButton.textContent =
                    "Setting Password...";

                try {

                    const {
                        data,
                        error
                    } = await nexusSupabase.auth.updateUser({
                        password: password
                    });

                    if (error) {
                        throw error;
                    }

                    if (!data.user) {
                        throw new Error(
                            "Password update could not be confirmed."
                        );
                    }

                    passwordForm.reset();

                    passwordForm.style.display = "none";

                    showMessage(
                        "Your password has been created successfully. Your Nexus Wealth Partners staff account is ready. You can now sign in using your invitation email address and new password.",
                        "success"
                    );

                } catch (error) {

                    console.error(
                        "Password setup error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to set your password. Please try again.",
                        "error"
                    );

                } finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Set My Password";
                }

            }
        );


        /* =====================================
           INITIALIZE PAGE
        ===================================== */

        checkInvitationSession();

    </script>

</body>
</html>
